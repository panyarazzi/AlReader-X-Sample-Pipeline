name: Private EPUB CSS injection and cascade trace

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-epub-css-injection-cascade-trace
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out public pipeline repository
        uses: actions/checkout@v5

      - name: Check out private APK and prior trace
        uses: actions/checkout@v5
        with:
          repository: panyarazzi/AlReader-X-APK-Transfer
          ref: analysis/epub-trace-44080555175
          token: ${{ secrets.SOURCE_REPO_READ_TOKEN }}
          path: _private-source
          sparse-checkout: |
            AlReaderX E-Ink-1.33.apk
            reports/private-epub-traces/trace-44080555175.md
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      - name: Verify private inputs
        shell: bash
        run: |
          set -euo pipefail
          APK="_private-source/AlReaderX E-Ink-1.33.apk"
          TRACE="_private-source/reports/private-epub-traces/trace-44080555175.md"
          test -s "$APK" && test -s "$TRACE"
          EXPECTED="$(git -C _private-source rev-parse "HEAD:AlReaderX E-Ink-1.33.apk")"
          ACTUAL="$(git hash-object "$APK")"
          test "$EXPECTED" = "$ACTUAL"
          echo "Original APK integrity: PASS"
          echo "Prior private trace: PRESENT"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download analysis tools
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/private-epub-css-injection-cascade-trace"
          mkdir -p "$WORK"
          curl -fsSL https://api.github.com/repos/iBotPeaches/Apktool/releases/latest -o "$WORK/apktool-release.json"
          APKTOOL_URL="$(jq -r '.assets[] | select(.name | test("^apktool_[0-9.]+[.]jar$")) | .browser_download_url' "$WORK/apktool-release.json" | head -n1)"
          [[ "$APKTOOL_URL" =~ ^https://github\.com/ ]]
          curl -fsSL "$APKTOOL_URL" -o "$WORK/apktool.jar"
          curl -fsSL https://api.github.com/repos/skylot/jadx/releases/latest -o "$WORK/jadx-release.json"
          JADX_URL="$(jq -r '.assets[] | select(.name | test("^jadx-[0-9.]+[.]zip$")) | .browser_download_url' "$WORK/jadx-release.json" | head -n1)"
          [[ "$JADX_URL" =~ ^https://github\.com/ ]]
          curl -fsSL "$JADX_URL" -o "$WORK/jadx.zip"
          mkdir -p "$WORK/jadx"
          unzip -q "$WORK/jadx.zip" -d "$WORK/jadx"
          JADX_BIN="$(find "$WORK/jadx" -type f -path '*/bin/jadx' | head -n1)"
          test -n "$JADX_BIN"
          chmod +x "$JADX_BIN"
          echo "APKTOOL_JAR=$WORK/apktool.jar" >> "$GITHUB_ENV"
          echo "JADX_BIN=$JADX_BIN" >> "$GITHUB_ENV"

      - name: Decode and decompile privately
        shell: bash
        run: |
          set -uo pipefail
          WORK="$RUNNER_TEMP/private-epub-css-injection-cascade-trace"
          java -jar "$APKTOOL_JAR" d -f "_private-source/AlReaderX E-Ink-1.33.apk" -o "$WORK/decoded" > "$WORK/apktool.log" 2>&1
          test -s "$WORK/decoded/AndroidManifest.xml"
          set +e
          "$JADX_BIN" --show-bad-code --output-dir "$WORK/jadx-out" "_private-source/AlReaderX E-Ink-1.33.apk" > "$WORK/jadx.log" 2>&1
          JADX_EXIT=$?
          set -e
          FILE_COUNT="$(find "$WORK/jadx-out" -type f 2>/dev/null | wc -l | tr -d ' ')"
          ERROR_COUNT="$(grep -E 'finished with errors, count:' "$WORK/jadx.log" | tail -n1 | sed 's/.*count: //' || true)"
          test "$FILE_COUNT" -gt 0
          if [[ "$JADX_EXIT" -eq 0 ]]; then RESULT=PASS
          elif [[ "$JADX_EXIT" -eq 3 ]]; then RESULT=PARTIAL
          else echo "Unexpected JADX exit: $JADX_EXIT"; exit "$JADX_EXIT"; fi
          echo "JADX_RESULT=$RESULT" >> "$GITHUB_ENV"
          echo "JADX_FILES=$FILE_COUNT" >> "$GITHUB_ENV"
          echo "JADX_ERRORS=${ERROR_COUNT:-unknown}" >> "$GITHUB_ENV"

      - name: Extract focused private callsite and cascade contexts
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/private-epub-css-injection-cascade-trace"
          REPORT="_private-source/reports/private-epub-traces/css-injection-cascade-${GITHUB_RUN_ID}.md"
          mkdir -p "$(dirname "$REPORT")"
          python3 - "$WORK/jadx-out" "$REPORT" <<'PY'
          import os,sys,re
          root,report=sys.argv[1:]
          java={}
          for base,_,names in os.walk(root):
            for name in names:
              if name.endswith('.java'):
                p=os.path.join(base,name)
                rel=os.path.relpath(p,root).replace(os.sep,'/')
                try:
                  with open(p,encoding='utf-8',errors='replace') as f: java[rel]=f.readlines()
                except OSError: pass
          def contexts(lines, pattern, before=12, after=22, cap=45):
            rx=re.compile(pattern,re.I)
            hits=[i for i,x in enumerate(lines) if rx.search(x)]
            spans=[]
            for i in hits:
              lo=max(0,i-before); hi=min(len(lines),i+after+1)
              if spans and lo<=spans[-1][1]+2: spans[-1]=(spans[-1][0],max(spans[-1][1],hi))
              else: spans.append((lo,hi))
            return hits,spans[:cap]
          targets=[
            ('TBookCSS getCSSString definition and body',r'/TBookCSS[.]java$',r'getCSSString[ ]*[(]'),
            ('TBookCSS generated-style callsites across all Java',None,r'getCSSString[ ]*[(]'),
            ('AlCSSStyles parseTemp definition and body',r'/AlCSSStyles[.]java$',r'parseTemp[ ]*[(]'),
            ('parseTemp callsites across all Java',None,r'[.]parseTemp[ ]*[(]'),
            ('AlSetCSS apply_WEIGHT methods and dispatch',r'/AlSetCSS[.]java$',r'apply_WEIGHT_[0-9]+[ ]*[(]|applyValue[ ]*[(]|acceptValue[ ]*[(]'),
            ('AlCSSStyles selector application dispatch',r'/AlCSSStyles[.]java$',r'apply1OneClassX[ ]*[(]|apply_WEIGHT_[0-9]+[ ]*[(]|applyValue[ ]*[(]'),
            ('AlOneCSSPair property masks and values',r'/AlOneCSSPair[.]java$',r'class AlOneCSSPair|long m_|long v_|important|priority'),
            ('TBookCSS construction and CSS preference lifecycle',r'/TBookCSS[.]java$',r'TBookCSS[ ]*[(]|getCSSString[ ]*[(]|cssEPUB|formatOptionWorked'),
            ('Default CSS replacement callsites',None,r'setRealCSS[ ]*[(]|DEFAULT_CSS_EPUB[ ]*='),
          ]
          with open(report,'w',encoding='utf-8') as out:
            out.write('# Private EPUB CSS injection and cascade trace\n\n')
            out.write('Focused bounded JADX contexts; private repository only.\n\n')
            out.write(f"- JADX: {os.environ.get('JADX_RESULT')} ({os.environ.get('JADX_FILES')} files; {os.environ.get('JADX_ERRORS')} errors)\n")
            out.write('- Original APK Git blob integrity verified before analysis.\n\n')
            for title,suffix,pattern in targets:
              out.write('## '+title+'\n\n')
              candidates=[(p,l) for p,l in java.items() if suffix and p.endswith(suffix)] if suffix else list(java.items())
              if not candidates:
                out.write('No matching decompiled file found. This is not proof of absence because JADX is partial.\n\n'); continue
              emitted=0
              for path,lines in candidates:
                hits,spans=contexts(lines,pattern,14,26,35)
                if not hits: continue
                out.write(f'### {path}: {len(hits)} matching lines\n\n')
                for lo,hi in spans:
                  emitted+=1
                  out.write(f'#### Lines {lo+1}-{hi}\n')
                  for n in range(lo,hi): out.write(f'{n+1}: {lines[n].rstrip()}\n')
                  out.write('\n')
                if suffix and emitted>=18: break
                if not suffix and emitted>=100: break
              if emitted==0: out.write('No matching contexts found in available JADX output; not proof of absence.\n\n')
            out.write('## Interpretation limits\n\n')
            out.write('- A callsite match does not establish runtime execution order without its caller and lifecycle context.\n')
            out.write('- JADX output is PARTIAL and may omit or misrepresent control flow.\n')
            out.write('- Selector weight order, set iteration order, and property-mask overwrite behavior must be interpreted together.\n')
            out.write('- Do not modify the APK until both CSS injection and cascade behavior are established.\n')
          print('Focused private CSS injection/cascade report created.')
          PY

      - name: Commit report to a new private branch
        shell: bash
        env:
          PRIVATE_REPORT_WRITE_TOKEN: ${{ secrets.PRIVATE_REPORT_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          cd _private-source
          BRANCH="analysis/epub-css-source-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add --sparse "reports/private-epub-traces/css-injection-cascade-${GITHUB_RUN_ID}.md"
          git commit -m "Add private EPUB CSS injection and cascade trace"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PRIVATE_REPORT_WRITE_TOKEN" | base64 -w0)" push origin "HEAD:refs/heads/$BRANCH"
          echo "PRIVATE_REPORT_BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Publish sanitized summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Private EPUB CSS injection and cascade trace"
            echo
            echo "- Original APK checked out privately and verified."
            echo "- Detailed decompiler excerpts are stored only in the private source repository."
            echo "- No source excerpts, identifiers, class names, paths, APK bytes, or decoded resources are published here."
            echo "- JADX: ${JADX_RESULT:-not completed}; generated files: ${JADX_FILES:-unknown}; errors: ${JADX_ERRORS:-unknown}."
            echo "- Private report branch: ${PRIVATE_REPORT_BRANCH:-not created}."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -rf _private-source
          rm -rf "$RUNNER_TEMP/private-epub-css-injection-cascade-trace"
