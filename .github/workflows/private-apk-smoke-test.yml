name: Private APK analysis smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-apk-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out public pipeline repository
        uses: actions/checkout@v4

      - name: Check out only the original APK from the private repository
        uses: actions/checkout@v4
        with:
          repository: panyarazzi/AlReader-X-APK-Transfer
          ref: main
          token: ${{ secrets.SOURCE_REPO_READ_TOKEN }}
          path: _private-source
          sparse-checkout: |
            AlReaderX E-Ink-1.33.apk
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      - name: Verify original APK and Git blob integrity
        shell: bash
        run: |
          set -euo pipefail
          APK="_private-source/AlReaderX E-Ink-1.33.apk"
          test -s "$APK"
          EXPECTED_BLOB="$(git -C _private-source rev-parse "HEAD:AlReaderX E-Ink-1.33.apk")"
          ACTUAL_BLOB="$(git hash-object "$APK")"
          test "$EXPECTED_BLOB" = "$ACTUAL_BLOB"
          echo "Private APK checkout: present"
          echo "Git blob integrity: PASS"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Apktool and JADX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private-apk-tools"
          curl -fsSL https://api.github.com/repos/iBotPeaches/Apktool/releases/latest -o "$RUNNER_TEMP/private-apk-tools/apktool-release.json"
          APKTOOL_URL="$(jq -r '.assets[] | select(.name | test("^apktool_[0-9.]+\\.jar$")) | .browser_download_url' "$RUNNER_TEMP/private-apk-tools/apktool-release.json" | head -n1)"
          [[ "$APKTOOL_URL" =~ ^https://github\.com/ ]]
          curl -fsSL "$APKTOOL_URL" -o "$RUNNER_TEMP/private-apk-tools/apktool.jar"
          test -s "$RUNNER_TEMP/private-apk-tools/apktool.jar"

          curl -fsSL https://api.github.com/repos/skylot/jadx/releases/latest -o "$RUNNER_TEMP/private-apk-tools/jadx-release.json"
          JADX_URL="$(jq -r '.assets[] | select(.name | test("^jadx-[0-9.]+\\.zip$")) | .browser_download_url' "$RUNNER_TEMP/private-apk-tools/jadx-release.json" | head -n1)"
          [[ "$JADX_URL" =~ ^https://github\.com/ ]]
          curl -fsSL "$JADX_URL" -o "$RUNNER_TEMP/private-apk-tools/jadx.zip"
          test -s "$RUNNER_TEMP/private-apk-tools/jadx.zip"

          mkdir -p "$RUNNER_TEMP/private-apk-tools/jadx"
          unzip -q "$RUNNER_TEMP/private-apk-tools/jadx.zip" -d "$RUNNER_TEMP/private-apk-tools/jadx"
          JADX_BIN="$(find "$RUNNER_TEMP/private-apk-tools/jadx" -type f -path '*/bin/jadx' | head -n1)"
          test -n "$JADX_BIN"
          chmod +x "$JADX_BIN"
          echo "APKTOOL_JAR=$RUNNER_TEMP/private-apk-tools/apktool.jar" >> "$GITHUB_ENV"
          echo "JADX_BIN=$JADX_BIN" >> "$GITHUB_ENV"
          echo "Apktool version: $(java -jar "$RUNNER_TEMP/private-apk-tools/apktool.jar" --version)"
          echo "JADX version: $("$JADX_BIN" --version 2>&1 | tail -n1)"

      - name: Decode original APK with Apktool
        shell: bash
        run: |
          set -euo pipefail
          APK="_private-source/AlReaderX E-Ink-1.33.apk"
          java -jar "$APKTOOL_JAR" d -f "$APK" -o "$RUNNER_TEMP/private-apk-tools/decoded"
          test -s "$RUNNER_TEMP/private-apk-tools/decoded/AndroidManifest.xml"
          echo "Apktool decode: PASS"

      - name: Decompile original APK with JADX
        shell: bash
        run: |
          set -uo pipefail
          APK="_private-source/AlReaderX E-Ink-1.33.apk"
          OUT="$RUNNER_TEMP/private-apk-tools/jadx-out"
          LOG="$RUNNER_TEMP/private-apk-tools/jadx.log"

          set +e
          "$JADX_BIN" --show-bad-code --output-dir "$OUT" "$APK" > "$LOG" 2>&1
          JADX_EXIT=$?
          set -e
          cat "$LOG"

          FILE_COUNT=0
          if [[ -d "$OUT" ]]; then
            FILE_COUNT="$(find "$OUT" -type f | wc -l | tr -d ' ')"
          fi
          ERROR_COUNT="$(grep -E 'finished with errors, count:' "$LOG" | tail -n1 | sed 's/.*count: //' || true)"
          echo "JADX exit code: $JADX_EXIT"
          echo "JADX output files: $FILE_COUNT"
          echo "JADX reported errors: ${ERROR_COUNT:-0}"

          if [[ "$FILE_COUNT" -eq 0 ]]; then
            echo "JADX produced no output files"
            exit 1
          fi

          if [[ "$JADX_EXIT" -eq 0 ]]; then
            echo "JADX_RESULT=PASS" >> "$GITHUB_ENV"
            echo "JADX_ERRORS=0" >> "$GITHUB_ENV"
          elif [[ "$JADX_EXIT" -eq 3 ]]; then
            echo "JADX_RESULT=PARTIAL" >> "$GITHUB_ENV"
            echo "JADX_ERRORS=${ERROR_COUNT:-unknown}" >> "$GITHUB_ENV"
            echo "::warning::JADX generated output but reported decompilation errors; manual review is required."
          else
            echo "Unexpected JADX exit code: $JADX_EXIT"
            exit "$JADX_EXIT"
          fi

      - name: Write non-sensitive smoke-test summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Private APK smoke test"
            echo
            echo "- Original APK fetched from the private repository using read-only access."
            echo "- Git blob integrity check: PASS."
            echo "- Apktool decode: PASS."
            if [[ "${JADX_RESULT:-FAIL}" == "PASS" ]]; then
              echo "- JADX decompile: PASS."
            else
              echo "- JADX decompile: PARTIAL; reported errors: ${JADX_ERRORS:-unknown}. Output files exist, but some classes require review."
            fi
            echo "- JADX partial results are not described as a full PASS."
            echo "- APK-derived files, logs, and source were not committed or uploaded as artifacts."
            echo "- No APK modifications were made."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary private source and analysis files
        if: always()
        shell: bash
        run: |
          rm -rf _private-source
          rm -rf "$RUNNER_TEMP/private-apk-tools"
